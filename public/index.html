<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Control Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   ERP CONTROL CENTER — DESIGN SYSTEM
   Palette (dark): base #0B1120, panel rgba(255,255,255,.05), accent cyan #00D9C0,
   accent violet #7C5CFC, amber #FFB020, red #FF5C6C
   Palette (light): base #F3F5F9, panel rgba(255,255,255,.72), text #1A2036
   Type: Sora (display), Inter (body/data)
   ====================================================================== */

:root{
  --bg:#0B1120;
  --bg-grad-a:#0B1120;
  --bg-grad-b:#131c33;
  --panel:rgba(255,255,255,0.055);
  --panel-strong:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.10);
  --border-soft:rgba(255,255,255,0.06);
  --text:#EAF0FF;
  --text-dim:#95A0C2;
  --text-faint:#5C6A8F;
  --accent:#00D9C0;
  --accent-2:#7C5CFC;
  --amber:#FFB020;
  --red:#FF5C6C;
  --green:#3ADB8F;
  --shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  --radius:18px;
  --radius-sm:12px;
  --ff-display:'Sora',sans-serif;
  --ff-body:'Inter',sans-serif;
  --sidebar-w:250px;
}
body.light{
  --bg:#EEF1F8;
  --bg-grad-a:#EEF1F8;
  --bg-grad-b:#E3E8F5;
  --panel:rgba(255,255,255,0.65);
  --panel-strong:rgba(255,255,255,0.85);
  --border:rgba(20,30,60,0.10);
  --border-soft:rgba(20,30,60,0.06);
  --text:#161B2E;
  --text-dim:#4C5573;
  --text-faint:#8992AD;
  --shadow:0 20px 50px -24px rgba(30,40,80,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--ff-body);
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%, rgba(124,92,252,0.16), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(0,217,192,0.13), transparent 40%),
    linear-gradient(160deg,var(--bg-grad-a),var(--bg-grad-b));
  background-attachment:fixed;
  min-height:100vh;
  transition:background .4s ease, color .3s ease;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#00201C;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

h1,h2,h3,h4{font-family:var(--ff-display);letter-spacing:-.01em;}
button{font-family:var(--ff-body);cursor:pointer;}
input,select,textarea{font-family:var(--ff-body);}

.hidden{display:none !important;}
.fade-in{animation:fadeIn .5s ease both;}
.slide-up{animation:slideUp .45s cubic-bezier(.2,.8,.2,1) both;}
.pop-in{animation:popIn .35s cubic-bezier(.2,.9,.3,1.2) both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,217,192,.4);}50%{box-shadow:0 0 0 8px rgba(0,217,192,0);}}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}

/* ---------- GLASS PANEL ---------- */
.glass{
  background:var(--panel);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* ============ LOGIN ============ */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.login-orb{
  position:fixed;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,217,192,.25),transparent 70%);
  top:-150px;left:-150px;filter:blur(10px);pointer-events:none;
}
.login-orb.two{
  background:radial-gradient(circle,rgba(124,92,252,.22),transparent 70%);
  top:auto;left:auto;bottom:-180px;right:-180px;
}
.login-card{
  width:100%;max-width:420px;padding:44px 40px;position:relative;z-index:2;
}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.login-brand .mark{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#04140F;font-family:var(--ff-display);
  box-shadow:0 8px 24px -6px rgba(0,217,192,.5);
}
.login-brand h1{font-size:22px;}
.login-sub{color:var(--text-dim);font-size:13.5px;margin-bottom:30px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);
  background:rgba(127,140,180,0.08);color:var(--text);font-size:14.5px;outline:none;
  transition:border .2s, box-shadow .2s, background .2s;
}
body.light .field input,body.light .field select,body.light .field textarea{background:rgba(255,255,255,.6);}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,217,192,.15);
}
.field textarea{resize:vertical;min-height:80px;}
.btn{
  border:none;border-radius:11px;padding:12px 20px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .15s, box-shadow .2s, opacity .2s, background .2s;
  color:#fff;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#00b3a0);color:#04211C;
  box-shadow:0 10px 24px -8px rgba(0,217,192,.55);
}
.btn-primary:hover{box-shadow:0 14px 30px -6px rgba(0,217,192,.7);transform:translateY(-1px);}
.btn-violet{background:linear-gradient(135deg,var(--accent-2),#5f3fe0);box-shadow:0 10px 24px -8px rgba(124,92,252,.5);}
.btn-violet:hover{transform:translateY(-1px);}
.btn-ghost{background:var(--panel-strong);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:linear-gradient(135deg,var(--red),#d43c4c);box-shadow:0 10px 22px -10px rgba(255,92,108,.6);}
.btn-danger:hover{transform:translateY(-1px);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.login-footer{margin-top:18px;text-align:center;font-size:12.5px;color:var(--text-faint);}
.link-btn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit;}
.error-msg{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip-check{
  display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;
  border:1px solid var(--border);background:rgba(127,140,180,0.08);cursor:pointer;font-size:13px;transition:.2s;
}
.chip-check.checked{border-color:var(--accent);background:rgba(0,217,192,.12);color:var(--accent);}
.chip-check input{accent-color:var(--accent);}

/* ============ APP SHELL ============ */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:22px 16px;
  border-right:1px solid var(--border-soft);
  background:var(--panel);backdrop-filter:blur(20px);
  z-index:30;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 24px;}
.sb-brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#04140F;font-family:var(--ff-display);font-size:15px;flex-shrink:0;}
.sb-brand span{font-family:var(--ff-display);font-weight:700;font-size:16px;}
.sb-nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
.sb-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
  color:var(--text-dim);font-size:14px;font-weight:600;border:1px solid transparent;
  transition:.2s;position:relative;
}
.sb-item .ic{width:19px;height:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sb-item:hover{background:var(--panel-strong);color:var(--text);cursor:pointer;}
.sb-item.active{background:linear-gradient(135deg,rgba(0,217,192,.16),rgba(124,92,252,.10));color:var(--text);border-color:rgba(0,217,192,.35);}
.sb-item.active .ic{color:var(--accent);}
.sb-foot{border-top:1px solid var(--border-soft);padding-top:14px;margin-top:10px;}
.user-pill{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;background:var(--panel-strong);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0A0F1E;flex-shrink:0;}
.user-meta{flex:1;min-width:0;}
.user-meta .un{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-meta .ur{font-size:11px;color:var(--text-dim);text-transform:capitalize;}
.icon-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;
}
.icon-btn:hover{color:var(--red);border-color:var(--red);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 30px;
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:20;
  background:rgba(11,17,32,0.35);backdrop-filter:blur(16px);
}
body.light .topbar{background:rgba(255,255,255,.35);}
.topbar h2{font-size:19px;}
.topbar .crumbs{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.tb-actions{display:flex;align-items:center;gap:10px;}
.toggle-group{display:flex;background:var(--panel-strong);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.toggle-group button{background:transparent;border:none;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--text-dim);}
.toggle-group button.active{background:linear-gradient(135deg,var(--accent),#00b3a0);color:#04211C;}
.theme-switch{
  width:52px;height:30px;border-radius:20px;background:var(--panel-strong);border:1px solid var(--border);
  position:relative;cursor:pointer;flex-shrink:0;
}
.theme-switch .knob{
  position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));transition:.3s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
body.light .theme-switch .knob{left:24px;}

.content{padding:26px 30px 60px;flex:1;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.page-head h1{font-size:25px;}
.page-head p{color:var(--text-dim);font-size:13.5px;margin-top:4px;}

.subnav{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.subnav button{
  padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
  color:var(--text-dim);font-size:13px;font-weight:600;transition:.2s;
}
.subnav button:hover{color:var(--text);border-color:var(--accent);}
.subnav button.active{background:linear-gradient(135deg,rgba(0,217,192,.2),rgba(124,92,252,.14));color:var(--text);border-color:var(--accent);}

/* ---------- KPI GRID ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:26px;}
.kpi-card{
  padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s, border-color .2s;
}
.kpi-card:hover{transform:translateY(-3px);border-color:rgba(0,217,192,.4);}
.kpi-card.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow);}
.kpi-card .kname{font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-card .kval{font-family:var(--ff-display);font-size:26px;font-weight:800;margin-bottom:6px;}
.kpi-card .ktarget{font-size:11.5px;color:var(--text-faint);margin-bottom:12px;}
.ring-wrap{position:absolute;top:14px;right:14px;width:46px;height:46px;}
.freq-badge{
  display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:6px;background:rgba(124,92,252,.16);color:var(--accent-2);
}
.ach-bar-track{height:6px;border-radius:6px;background:rgba(127,140,180,.18);overflow:hidden;margin-top:10px;}
.ach-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1);}

.chart-panel{padding:20px 22px;margin-bottom:26px;}
.chart-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.chart-panel-head h3{font-size:15.5px;}
.chart-box{height:280px;position:relative;}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;min-width:640px;}
.data-table thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);
  padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;
}
.data-table tbody td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--border-soft);}
.data-table tbody tr{transition:background .15s;}
.data-table tbody tr:hover{background:var(--panel-strong);}
.data-table tbody tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:8px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill-green{background:rgba(58,219,143,.15);color:var(--green);}
.pill-amber{background:rgba(255,176,32,.15);color:var(--amber);}
.pill-red{background:rgba(255,92,108,.15);color:var(--red);}
.pill-violet{background:rgba(124,92,252,.15);color:var(--accent-2);}

.section-card{padding:22px 24px;margin-bottom:24px;}
.section-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.section-card-head h3{font-size:16.5px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint);}
.empty-state .ic{font-size:36px;margin-bottom:10px;opacity:.6;}
.empty-state p{font-size:13.5px;}

/* ---------- PROJECTS ---------- */
.project-block{margin-bottom:24px;}
.project-block .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.project-block .ph .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(0,217,192,.15);}
.progress-mini{width:120px;height:8px;border-radius:8px;background:rgba(127,140,180,.18);overflow:hidden;}
.progress-mini > div{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));}

/* ---------- TICKETS ---------- */
.ticket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.ticket-card{padding:18px;cursor:pointer;transition:.2s;}
.ticket-card:hover{transform:translateY(-3px);border-color:rgba(124,92,252,.4);}
.ticket-card .th{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.ticket-card h4{font-size:14.5px;}
.ticket-card p{font-size:12.5px;color:var(--text-dim);margin-top:6px;line-height:1.5;max-height:56px;overflow:hidden;}
.ticket-card .meta{margin-top:12px;font-size:11px;color:var(--text-faint);display:flex;justify-content:space-between;}

/* ---------- REPORTS ---------- */
.file-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;border:1px solid var(--border-soft);margin-bottom:10px;transition:.2s;}
.file-row:hover{background:var(--panel-strong);}
.file-ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(0,217,192,.2),rgba(124,92,252,.15));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.file-info{flex:1;min-width:0;}
.file-info .fn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-info .fm{font-size:11.5px;color:var(--text-faint);}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,7,16,0.6);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:28px;}
.modal-box.wide{max-width:600px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-head h3{font-size:18px;}
.modal-close{width:30px;height:30px;border-radius:9px;background:var(--panel-strong);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close:hover{color:var(--red);}
.modal-actions{display:flex;gap:10px;margin-top:22px;justify-content:flex-end;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.two-col{grid-template-columns:1fr;}}

/* ---------- TOAST ---------- */
#toastHost{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{padding:14px 18px;border-radius:12px;font-size:13.5px;font-weight:600;min-width:240px;display:flex;align-items:center;gap:10px;}
.toast.ok{border-left:3px solid var(--green);}
.toast.err{border-left:3px solid var(--red);}
.toast.info{border-left:3px solid var(--accent-2);}

/* ---------- MISC ---------- */
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat-box{padding:16px 18px;}
.stat-box .sv{font-family:var(--ff-display);font-size:24px;font-weight:800;}
.stat-box .sl{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.badge-role{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:rgba(124,92,252,.18);color:var(--accent-2);text-transform:capitalize;}
.access-tags{display:flex;gap:6px;flex-wrap:wrap;}
.access-tag{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:rgba(0,217,192,.14);color:var(--accent);text-transform:capitalize;}
textarea.comment-box{width:100%;min-height:50px;font-size:12.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(127,140,180,.08);color:var(--text);resize:vertical;}
.hamburger{display:none;}
.screenshot-preview{max-width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--border);}
.status-open{color:var(--amber);}
.status-closed{color:var(--text-faint);}

@media (max-width:960px){
  .sidebar{position:fixed;left:-280px;top:0;height:100vh;transition:left .3s ease;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
  .sidebar.open{left:0;box-shadow:20px 0 60px rgba(0,0,0,.4);}
  .hamburger{display:flex;}
  .content{padding:20px 16px 50px;}
  .topbar{padding:14px 16px;}
}
@media (min-width:1700px){
  html{font-size:17px;}
  .content{padding:34px 48px 70px;}
}
</style>
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
  <div class="login-orb"></div>
  <div class="login-orb two"></div>
  <div class="glass login-card pop-in" id="loginCardBox"></div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="mark">EC</div>
      <span data-i18n="brandName">ERP Center</span>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>

function t(key){ return (I18N[state.lang] && I18N[state.lang][key]) || key; }

/* ---------------------- API LAYER (shared SQLite database on the server) ----------------------
   Every logged-in user reads/writes the SAME server-side database, so data
   (KPIs, tickets, projects, reports) is visible between Manager <-> SAP <-> Inventory <-> Projects.
   -------------------------------------------------------------------------------------------- */
const TOKEN_KEY = "erp_auth_token";
function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(tok){ if(tok) localStorage.setItem(TOKEN_KEY, tok); else localStorage.removeItem(TOKEN_KEY); }

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  const tok = getToken();
  if(tok) headers["Authorization"] = "Bearer "+tok;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let body = null;
  try{ body = await res.json(); }catch(e){ body = null; }
  if(!res.ok){
    const err = new Error((body && body.error) || ("Request failed ("+res.status+")"));
    err.status = res.status;
    throw err;
  }
  return body;
}

function defaultDB(){
  return {
    users:[],
    currentUser:null,
    kpis:{
      sap:{client:[],supplier:[],production:[],reception:[],shipping:[]},
      inventory:{production:[],quality:[],shipping:[],reception:[]}
    },
    projects:[],
    tickets:{sap:[],inventory:[],projects:[]},
    reports:{sap:[],inventory:[],projects:[]},
    settings:{theme:"dark", lang:"en"}
  };
}
let db = defaultDB();

/* Pulls the shared state (kpis/projects/tickets/reports/settings), the user
   directory, and "who am I" from the server and hydrates the local `db` mirror. */
async function fetchState(){
  const res = await api("/api/state");
  db.kpis = res.state.kpis;
  db.projects = res.state.projects;
  db.tickets = res.state.tickets;
  db.reports = res.state.reports;
  db.settings = res.state.settings;
  db.users = res.users;
  db.currentUser = res.me;
}
/* Persists the shared, non-sensitive parts of the state (never passwords/users —
   those go through their own dedicated endpoints). Fire-and-forget with error toast. */
function saveDB(){
  api("/api/state", {
    method:"POST",
    body: JSON.stringify({kpis:db.kpis, projects:db.projects, tickets:db.tickets, reports:db.reports, settings:db.settings})
  }).catch(()=> toast("Sync error — check your connection.", "err"));
}

/* ---------------------- STATE ---------------------- */
let state = {
  lang: (db.settings && db.settings.lang) || "en",
  theme: (db.settings && db.settings.theme) || "dark",
  page: null,
  sub: null,
  openCharts: {}, // key: pageKey.subKey -> kpiId open
  charts: {} // canvasId -> Chart.js instance
};

function uid(prefix){ return (prefix||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowStr(){ const d=new Date(); return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function currentUser(){ return db.currentUser; }
function isManager(u){ u=u||currentUser(); return u && u.role==="manager"; }
function userHasPage(u, page){ u=u||currentUser(); return u && (u.role==="manager" || (u.pages||[]).includes(page)); }

/* ---------------------- TOASTS ---------------------- */
function toast(msg, type){
  type = type||"ok";
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast glass "+type+" slide-up";
  const icon = type==="ok"?"✓":type==="err"?"✕":"ℹ";
  el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .4s"; el.style.opacity="0"; setTimeout(()=>el.remove(),400); }, 3200);
}

/* ---------------------- THEME & LANG ---------------------- */
function applyTheme(){
  document.body.classList.toggle("light", state.theme==="light");
  const knob = document.getElementById("themeKnob");
  if(knob) knob.textContent = state.theme==="light" ? "☀" : "☾";
}
function applyLangToggle(){
  document.querySelectorAll("#langToggle button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===state.lang);
  });
}
function setTheme(th){
  state.theme=th;
  applyTheme();
  if(currentUser()){ db.settings.theme=th; saveDB(); }
}
function setLang(l){
  state.lang=l;
  applyLangToggle();
  if(currentUser()){ db.settings.lang=l; saveDB(); renderAll(); }
  else if(!document.getElementById("app").classList.contains("hidden")){ renderAll(); }
  else { renderLogin(); }
}

/* ======================================================================
   LOGIN / AUTH RENDERING
   ====================================================================== */
async function renderLogin(){
  const box = document.getElementById("loginCardBox");
  box.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-dim);font-size:13.5px;">…</div>`;
  let needsSetup = false;
  try{
    const res = await api("/api/needs-setup");
    needsSetup = res.needsSetup;
  }catch(e){
    box.innerHTML = `<div style="padding:10px;text-align:center;">
      <div class="login-brand" style="justify-content:center;"><div class="mark">EC</div><h1>${t('brandName')}</h1></div>
      <p class="error-msg" style="margin-top:14px;">Cannot reach the server. Is it running?</p>
    </div>`;
    return;
  }

  if(needsSetup){
    box.innerHTML = `
      <div class="login-brand"><div class="mark">EC</div><h1>${t('brandName')}</h1></div>
      <div class="login-sub">${t('loginSubSetup')}</div>
      <div class="field"><label>${t('username')}</label><input id="setupUser" type="text" autocomplete="off"></div>
      <div class="field"><label>${t('password')}</label><input id="setupPass" type="password"></div>
      <div class="field"><label>${t('confirmPassword')}</label><input id="setupPass2" type="password"></div>
      <button class="btn btn-primary btn-block" id="setupBtn">${t('createManager')}</button>
      <div class="error-msg" id="loginErr"></div>
    `;
    document.getElementById("setupBtn").onclick = async ()=>{
      const u = document.getElementById("setupUser").value.trim();
      const p = document.getElementById("setupPass").value;
      const p2 = document.getElementById("setupPass2").value;
      const errEl = document.getElementById("loginErr");
      if(!u||!p||!p2){ errEl.textContent=t('fillAllFields'); return; }
      if(p!==p2){ errEl.textContent=t('passwordMismatch'); return; }
      try{
        const res = await api("/api/setup", {method:"POST", body:JSON.stringify({username:u, password:p})});
        setToken(res.token);
        await bootApp();
      }catch(e){ errEl.textContent = e.message; }
    };
  } else {
    let usernames = [];
    try{ usernames = (await api("/api/usernames")).usernames; }catch(e){}
    box.innerHTML = `
      <div class="login-brand"><div class="mark">EC</div><h1>${t('welcomeBack')}</h1></div>
      <div class="login-sub">${t('loginSub')}</div>
      <div class="field"><label>${t('username')}</label><input id="loginUser" type="text" list="userList" autocomplete="off"></div>
      <datalist id="userList">${usernames.map(u=>`<option value="${escAttr(u)}">`).join("")}</datalist>
      <div class="field"><label>${t('password')}</label><input id="loginPass" type="password"></div>
      <button class="btn btn-primary btn-block" id="loginBtn">${t('signIn')}</button>
      <div class="error-msg" id="loginErr"></div>
    `;
    const doLogin = async ()=>{
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value;
      const errEl = document.getElementById("loginErr");
      if(!u||!p){ errEl.textContent=t('fillAllFields'); return; }
      try{
        const res = await api("/api/login", {method:"POST", body:JSON.stringify({username:u, password:p})});
        setToken(res.token);
        await bootApp();
      }catch(e){ errEl.textContent = t('invalidCredentials'); }
    };
    document.getElementById("loginBtn").onclick = doLogin;
    document.getElementById("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  }
}
function escAttr(s){ return String(s).replace(/"/g,"&quot;"); }
function escHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById("langToggle").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  setLang(b.dataset.lang);
});
document.getElementById("themeSwitch").addEventListener("click", ()=> setTheme(state.theme==="dark"?"light":"dark"));

/* ======================================================================
   APP BOOT / NAV
   ====================================================================== */
async function bootApp(){
  try{
    await fetchState();
  }catch(e){
    setToken(null);
    document.getElementById("loginScreen").classList.remove("hidden");
    renderLogin();
    return;
  }
  state.lang = db.settings.lang || state.lang;
  state.theme = db.settings.theme || state.theme;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  const u = currentUser();
  const pages = u.role==="manager" ? ["users","sap","inventory","projects"] : (u.pages||[]);
  state.page = pages[0] || null;
  state.sub = null;
  renderAll();
}
async function doLogout(){
  try{ await api("/api/logout", {method:"POST"}); }catch(e){}
  setToken(null);
  db = defaultDB();
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  renderLogin();
}
document.getElementById("logoutBtn").addEventListener("click", doLogout);
document.getElementById("hamburgerBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

const NAV_ICONS = {
  users:"👥", sap:"🗄", inventory:"📦", projects:"📁"
};
function renderSidebar(){
  const u = currentUser();
  if(!u) return;
  document.getElementById("avatarInit").textContent = u.username.slice(0,2).toUpperCase();
  document.getElementById("curUserName").textContent = u.username;
  document.getElementById("curUserRole").textContent = u.role==="manager" ? t('manager') : t('user');

  const navPages = u.role==="manager" ? ["users","sap","inventory","projects"] : (u.pages||[]);
  const labelMap = {users:t('navUsers'), sap:t('navSap'), inventory:t('navInventory'), projects:t('navProjects')};
  const nav = document.getElementById("sbNav");
  nav.innerHTML = navPages.map(p=>`
    <div class="sb-item ${state.page===p?'active':''}" data-page="${p}">
      <span class="ic">${NAV_ICONS[p]}</span><span>${labelMap[p]}</span>
    </div>
  `).join("") || `<div style="padding:14px;font-size:12.5px;color:var(--text-faint)">${t('noPages')}</div>`;
  nav.querySelectorAll(".sb-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.page = el.dataset.page;
      state.sub = null;
      document.getElementById("sidebar").classList.remove("open");
      renderAll();
    });
  });
}

function renderAll(){
  applyTheme();
  applyLangToggle();
  renderSidebar();
  renderMain();
}

/* ======================================================================
   MAIN ROUTER
   ====================================================================== */
const PAGE_TITLES = {
  users:()=>t('navUsers'), sap:()=>t('navSap'), inventory:()=>t('navInventory'), projects:()=>t('navProjects')
};
function renderMain(){
  const main = document.getElementById("mainContent");
  const u = currentUser();
  if(!u || !state.page){ main.innerHTML = `<div class="empty-state glass"><div class="ic">🔒</div><p>${t('noPages')}</p></div>`; return; }
  if(!userHasPage(u, state.page)){ main.innerHTML = `<div class="empty-state glass"><div class="ic">🚫</div><p>${t('requiredNoAccess')}</p></div>`; return; }

  document.getElementById("pageTitle").textContent = PAGE_TITLES[state.page] ? PAGE_TITLES[state.page]() : "";
  document.getElementById("pageCrumb").textContent = u.username + " / " + (PAGE_TITLES[state.page] ? PAGE_TITLES[state.page]() : "");

  if(state.page==="users") return renderUsersPage(main);
  if(state.page==="sap") return renderDeptPage(main, "sap", ["client","supplier","production","reception","shipping"]);
  if(state.page==="inventory") return renderDeptPage(main, "inventory", ["production","quality","shipping","reception"]);
  if(state.page==="projects") return renderProjectsPage(main);
}

/* ======================================================================
   USERS & ACCESS PAGE (Manager only)
   ====================================================================== */
function renderUsersPage(main){
  const u = currentUser();
  if(!isManager(u)){ main.innerHTML = `<div class="empty-state glass"><div class="ic">🚫</div><p>${t('requiredNoAccess')}</p></div>`; return; }

    const tagList = usr.role==="manager"
      ? ['sap','inventory','projects'].map(p=>`<span class="access-tag">${p.toUpperCase()}</span>`).join("")
      : (usr.pages||[]).map(p=>`<span class="access-tag">${p.toUpperCase()}</span>`).join("") || "—";
    return `
      <tr>
        <td><strong>${escHtml(usr.username)}</strong></td>
        <td><span class="badge-role">${usr.role==="manager"?t('manager'):t('user')}</span></td>

        <td class="row-actions">
          ${usr.role!=="manager" ? `<button class="btn btn-danger btn-sm" data-del-user="${usr.id}">${t('delete')}</button>` : `<span style="font-size:12px;color:var(--text-faint)">—</span>`}
        </td>

      <div class="glass stat-box"><div class="sv">${db.users.length}</div><div class="sl">${t('totalUsers')}</div></div>

function countOpenTickets(){
  let c=0; ["sap","inventory","projects"].forEach(p=>{ (db.tickets[p]||[]).forEach(tk=>{ if(tk.status==="open") c++; }); });
  return c;
}
function countTotalKpis(){
  let c=0;
  Object.values(db.kpis.sap).forEach(arr=>c+=arr.length);
  Object.values(db.kpis.inventory).forEach(arr=>c+=arr.length);
  return c;
}
function openCreateUserModal(){
  const html = `
    <div class="modal-head"><h3>${t('newUserTitle')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${t('username')}</label><input id="nuUsername" type="text"></div>

      <label>${t('pageAccess')}</label>
      <div class="chips">
        <label class="chip-check"><input type="checkbox" value="sap"><span>${t('access_sap')}</span></label>
        <label class="chip-check"><input type="checkbox" value="inventory"><span>${t('access_inventory')}</span></label>
        <label class="chip-check"><input type="checkbox" value="projects"><span>${t('access_projects')}</span></label>
      </div>
    </div>
    <div class="error-msg" id="nuErr"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-primary" id="nuSubmit">${t('create')}</button>
    </div>
  `;
  const modal = openModal(html);
  modal.querySelectorAll(".chip-check").forEach(chip=>{
    const cb = chip.querySelector("input");
    cb.addEventListener("change", ()=> chip.classList.toggle("checked", cb.checked));
  });
  modal.querySelector("#nuSubmit").onclick = async ()=>{
    const username = modal.querySelector("#nuUsername").value.trim();
    const password = modal.querySelector("#nuPassword").value;
    const pages = Array.from(modal.querySelectorAll(".chip-check input:checked")).map(x=>x.value);

      await fetchState();
      closeModal(); toast(t('userCreated')); renderUsersPage(document.getElementById("mainContent"));
    }catch(e){ errEl.textContent = e.message==="Username already exists."? t('userExists') : e.message; }

function openModal(innerHtml, wide){
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal-overlay fade-in" id="modalOverlay"><div class="glass modal-box ${wide?'wide':''} pop-in">${innerHtml}</div></div>`;
  const overlay = document.getElementById("modalOverlay");
  overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
  overlay.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click", closeModal));
  return overlay;
}
function closeModal(){ document.getElementById("modalHost").innerHTML = ""; }
function confirmDialog(msg, onYes){
  const html = `
    <div class="modal-head"><h3>${t('delete')}?</h3><button class="modal-close" data-close>✕</button></div>
    <p style="font-size:14px;color:var(--text-dim);margin-bottom:10px;">${msg}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-danger" id="confirmYes">${t('delete')}</button>
    </div>`;
  const modal = openModal(html);
  modal.querySelector("#confirmYes").onclick = ()=>{ closeModal(); onYes(); };
}

const SUB_LABEL_KEYS = {

  shipping:"subShipping", quality:"subQuality", tickets:"subTickets", reports:"subReports", main:"subMain"
};
function renderDeptPage(main, pageKey, kpiSubs){

  main.innerHTML = `
    <div class="page-head fade-in">

/* ---------------- KPI SECTION (shared by SAP & Inventory) ---------------- */
function getKpiArr(pageKey, subKey){ return db.kpis[pageKey][subKey]; }
function computeAchievement(k){ if(!k.target || k.target===0) return 0; return Math.round((k.current/k.target)*1000)/10; }
function achColor(pct){ if(pct>=90) return "green"; if(pct>=60) return "amber"; return "red"; }

function renderKpiSection(body, pageKey, subKey){
  const arr = getKpiArr(pageKey, subKey);
  const openKey = pageKey+"."+subKey;
  const openKpiId = state.openCharts[openKey];

  const cards = arr.map(k=>{
    const ach = computeAchievement(k);
    const col = achColor(ach);
    return `
      <div class="glass kpi-card slide-up ${openKpiId===k.id?'open':''}" data-kpi-card="${k.id}">
        <div class="kname">${escHtml(k.name)}</div>
        <div class="kval">${formatNum(k.current)}<span style="font-size:13px;color:var(--text-faint);font-weight:600;"> ${k.unit==='%'?'%':'K€'}</span></div>
        <div class="ktarget">${t('targetShort')}: ${formatNum(k.target)} ${k.unit==='%'?'%':'K€'} · <span class="freq-badge">${t(k.frequency)}</span></div>
        <div class="ach-bar-track"><div class="ach-bar-fill" style="width:${Math.min(ach,100)}%;background:${col==='green'?'linear-gradient(90deg,#3ADB8F,#00D9C0)':col==='amber'?'linear-gradient(90deg,#FFB020,#ff8a20)':'linear-gradient(90deg,#FF5C6C,#ff2f4c)'}"></div></div>
        <div style="margin-top:8px;font-size:12px;font-weight:700;color:var(--${col==='green'?'green':col==='amber'?'amber':'red'})">${ach}%</div>
      </div>`;
  }).join("");

  body.innerHTML = `
    <div class="glass section-card slide-up">
      <div class="section-card-head">
        <h3>${t('kpiTableTitle')}</h3>
        <button class="btn btn-primary btn-sm" id="addKpiBtn">${t('addKpi')}</button>
      </div>
      ${arr.length===0 ? `<div class="empty-state"><div class="ic">📊</div><p>${t('noKpis')}</p><p style="margin-top:4px;">${t('noKpisSub')}</p></div>` : `
      <div class="kpi-grid">${cards}</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr>
          <th>${t('kpiName')}</th><th>${t('currentValue')}</th><th>${t('targetValue')}</th>
          <th>${t('achievement')}</th><th>${t('frequency')}</th><th>${t('actions')}</th>
        </tr></thead>
        <tbody>
          ${arr.map(k=>{
            const ach = computeAchievement(k); const col = achColor(ach);
            return `<tr>
              <td><strong>${escHtml(k.name)}</strong></td>
              <td>${formatNum(k.current)} ${k.unit==='%'?'%':'K€'}</td>
              <td>${formatNum(k.target)} ${k.unit==='%'?'%':'K€'}</td>
              <td><span class="pill pill-${col==='green'?'green':col==='amber'?'amber':'red'}">${ach}%</span></td>
              <td><span class="freq-badge">${t(k.frequency)}</span></td>
              <td class="row-actions">
                <button class="btn btn-ghost btn-sm" data-edit-val="${k.id}">${t('editValue')}</button>
                <button class="btn btn-danger btn-sm" data-del-kpi="${k.id}">${t('delete')}</button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>`}
    </div>
    <div id="chartPanelHost"></div>
  `;

  document.getElementById("addKpiBtn").onclick = ()=> openAddKpiModal(pageKey, subKey, body);
  body.querySelectorAll("[data-kpi-card]").forEach(card=>{
    card.onclick = ()=> toggleKpiChart(pageKey, subKey, card.dataset.kpiCard, body);
  });
  body.querySelectorAll("[data-edit-val]").forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openEditValueModal(pageKey, subKey, b.dataset.editVal, body); };
  });
  body.querySelectorAll("[data-del-kpi]").forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      confirmDialog(t('confirmDeleteKpi'), ()=>{
        db.kpis[pageKey][subKey] = getKpiArr(pageKey, subKey).filter(x=>x.id!==b.dataset.delKpi);
        if(state.openCharts[openKey]===b.dataset.delKpi) delete state.openCharts[openKey];
        saveDB(); toast(t('toastKpiDeleted')); renderKpiSection(body, pageKey, subKey);
      });
    };
  });

  if(openKpiId && arr.some(k=>k.id===openKpiId)){
    renderChartPanel(pageKey, subKey, openKpiId);
  }
}
function formatNum(n){ n = Number(n)||0; return n.toLocaleString(undefined,{maximumFractionDigits:2}); }

function toggleKpiChart(pageKey, subKey, kpiId, body){
  const key = pageKey+"."+subKey;
  if(state.openCharts[key]===kpiId){ delete state.openCharts[key]; }
  else { state.openCharts[key] = kpiId; }
  renderKpiSection(body, pageKey, subKey);
}

function renderChartPanel(pageKey, subKey, kpiId){
  const host = document.getElementById("chartPanelHost");
  const k = getKpiArr(pageKey, subKey).find(x=>x.id===kpiId);
  if(!k || !host) return;
  const canvasId = "chart_"+kpiId;
  host.innerHTML = `
    <div class="glass chart-panel slide-up">
      <div class="chart-panel-head">
        <h3>${t('variationChart')} — ${escHtml(k.name)}</h3>
      </div>
      <div class="chart-box"><canvas id="${canvasId}"></canvas></div>
    </div>
  `;
  drawKpiChart(canvasId, k);
}
function drawKpiChart(canvasId, k){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(state.charts[canvasId]){ state.charts[canvasId].destroy(); }
  const hist = (k.history && k.history.length) ? k.history : [{date:nowStr(), value:k.current}];
  const labels = hist.map(h=>h.date);
  const values = hist.map(h=>h.value);
  const isLight = state.theme==="light";
  const gridColor = isLight ? "rgba(20,30,60,0.08)" : "rgba(255,255,255,0.08)";
  const textColor = isLight ? "#4C5573" : "#95A0C2";
  state.charts[canvasId] = new Chart(ctx, {
    type:"line",
    data:{
      labels,
      datasets:[
        {
          label:t('value'), data:values, borderColor:"#00D9C0", backgroundColor:"rgba(0,217,192,0.14)",
          borderWidth:2.5, tension:.35, fill:true, pointRadius:4, pointBackgroundColor:"#00D9C0", pointBorderColor:"#00201C"
        },
        {
          label:t('target'), data:hist.map(()=>k.target), borderColor:"#7C5CFC", borderDash:[6,5],
          borderWidth:2, tension:0, pointRadius:0, fill:false
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{labels:{color:textColor, font:{family:"Inter", size:11}}} },
      scales:{
        x:{ ticks:{color:textColor, font:{size:10.5}}, grid:{color:gridColor} },
        y:{ ticks:{color:textColor, font:{size:10.5}}, grid:{color:gridColor} }
      }
    }
  });
}

function openAddKpiModal(pageKey, subKey, body){
  const html = `
    <div class="modal-head"><h3>${t('newKpiTitle')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${t('kpiName')}</label><input id="kName" type="text"></div>
    <div class="two-col">
      <div class="field"><label>${t('targetValue')}</label><input id="kTarget" type="number" step="any"></div>
      <div class="field"><label>${t('targetUnit')}</label>
        <select id="kUnit"><option value="K€">K€</option><option value="%">%</option></select>
      </div>
    </div>
    <div class="field"><label>${t('frequency')}</label>
      <select id="kFreq">
        <option value="daily">${t('daily')}</option><option value="weekly">${t('weekly')}</option>
        <option value="monthly">${t('monthly')}</option><option value="yearly">${t('yearly')}</option>
      </select>
    </div>
    <div class="error-msg" id="kErr"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-primary" id="kSubmit">${t('create')}</button>
    </div>
  `;
  const modal = openModal(html);
  modal.querySelector("#kSubmit").onclick = ()=>{
    const name = modal.querySelector("#kName").value.trim();
    const target = parseFloat(modal.querySelector("#kTarget").value);
    const unit = modal.querySelector("#kUnit").value;
    const freq = modal.querySelector("#kFreq").value;
    const errEl = modal.querySelector("#kErr");
    if(!name || isNaN(target)){ errEl.textContent = t('fillAllFields'); return; }
    getKpiArr(pageKey, subKey).push({
      id:uid("kpi"), name, current:0, target, unit, frequency:freq,
      history:[{date:nowStr(), value:0}]
    });
    saveDB(); closeModal(); toast(t('toastKpiAdded')); renderKpiSection(body, pageKey, subKey);
  };
}
function openEditValueModal(pageKey, subKey, kpiId, body){
  const k = getKpiArr(pageKey, subKey).find(x=>x.id===kpiId);
  const html = `
    <div class="modal-head"><h3>${t('editValueTitle')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${escHtml(k.name)} — ${t('currentValue')}</label><input id="vNew" type="number" step="any" value="${k.current}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-primary" id="vSubmit">${t('save')}</button>
    </div>
  `;
  const modal = openModal(html);
  modal.querySelector("#vSubmit").onclick = ()=>{
    const val = parseFloat(modal.querySelector("#vNew").value);
    if(isNaN(val)) return;
    k.current = val;
    k.history = k.history || [];
    k.history.push({date:nowStr(), value:val});
    saveDB(); closeModal(); toast(t('toastValueUpdated'));
    renderKpiSection(body, pageKey, subKey);
  };
}

        proj.milestones = proj.milestones.filter(m=>m.id!==mid);
        saveDB(); toast(t('toastMilestoneDeleted')); renderProjectsMain(body);
      });
    };
  });
}

    proj.milestones.push({id:uid("ms"), name, progress:0, frequency:freq, comments:""});
    saveDB(); closeModal(); toast(t('toastMilestoneAdded'));
    renderProjectsMain(body);
  };
}
function openEditMilestoneProgress(pid, mid, body){
  const proj = db.projects.find(x=>x.id===pid);
  const m = proj.milestones.find(x=>x.id===mid);
  const html = `
    <div class="modal-head"><h3>${t('editValueTitle')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${escHtml(m.name)} — ${t('progress')}</label><input id="prNew" type="number" min="0" max="100" value="${m.progress}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-primary" id="prSubmit">${t('save')}</button>
    </div>`;
  const modal = openModal(html);
  modal.querySelector("#prSubmit").onclick = ()=>{
    let val = parseFloat(modal.querySelector("#prNew").value);
    if(isNaN(val)) return;
    val = Math.max(0, Math.min(100, val));
    m.progress = val;
    saveDB(); closeModal(); toast(t('toastValueUpdated'));
    renderProjectsMain(body);
  };
}
function openEditMilestoneComment(pid, mid, body){
  const proj = db.projects.find(x=>x.id===pid);
  const m = proj.milestones.find(x=>x.id===mid);
  const html = `
    <div class="modal-head"><h3>${t('commentTitle')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${escHtml(m.name)}</label><textarea id="cNew" rows="4">${escHtml(m.comments||"")}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-primary" id="cSubmit">${t('save')}</button>
    </div>`;
  const modal = openModal(html);
  modal.querySelector("#cSubmit").onclick = ()=>{
    m.comments = modal.querySelector("#cNew").value;
    saveDB(); closeModal(); toast(t('toastCommentSaved'));
    renderProjectsMain(body);
  };
}

/* ======================================================================
   TICKETS SECTION (shared: sap / inventory / projects)
   ====================================================================== */
function renderTicketsSection(body, pageKey){
  const list = db.tickets[pageKey] || [];
  body.innerHTML = `
    <div class="glass section-card slide-up">
      <div class="section-card-head">
        <h3>${t('ticketsTitle')}</h3>
        <button class="btn btn-primary btn-sm" id="openTicketBtn">${t('openTicket')}</button>
      </div>
      ${list.length===0 ? `<div class="empty-state"><div class="ic">🎫</div><p>${t('noTickets')}</p><p style="margin-top:4px;">${t('noTicketsSub')}</p></div>` : `
      <div class="ticket-grid">
        ${list.slice().reverse().map(tk=>`
          <div class="glass ticket-card" data-ticket="${tk.id}">
            <div class="th">
              <h4>${escHtml(tk.title)}</h4>
              <span class="pill ${tk.status==='open'?'pill-amber':'pill-green'}">${tk.status==='open'?t('open'):t('closed')}</span>
            </div>
            <p>${escHtml(tk.description)}</p>
            <div class="meta"><span>${escHtml(tk.errorLocation||"—")}</span><span>${escHtml(tk.date)}</span></div>
          </div>`).join("")}
      </div>`}
    </div>
  `;
  document.getElementById("openTicketBtn").onclick = ()=> openNewTicketModal(pageKey, body);
  body.querySelectorAll("[data-ticket]").forEach(card=>{
    card.onclick = ()=> openTicketDetail(pageKey, card.dataset.ticket, body);
  });
}
function openNewTicketModal(pageKey, body){
  const html = `
    <div class="modal-head"><h3>${t('newTicketTitle')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${t('ticketTitleField')}</label><input id="tkTitle" type="text"></div>
    <div class="field"><label>${t('description')}</label><textarea id="tkDesc" rows="3"></textarea></div>
    <div class="field"><label>${t('errorLocation')}</label><input id="tkLoc" type="text"></div>
    <div class="field"><label>${t('uploadScreenshot')}</label><input id="tkFile" type="file" accept="image/*"></div>
    <div class="error-msg" id="tkErr"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-primary" id="tkSubmit">${t('create')}</button>
    </div>`;
  const modal = openModal(html);
  modal.querySelector("#tkSubmit").onclick = ()=>{
    const title = modal.querySelector("#tkTitle").value.trim();
    const desc = modal.querySelector("#tkDesc").value.trim();
    const loc = modal.querySelector("#tkLoc").value.trim();
    const fileInput = modal.querySelector("#tkFile");
    const errEl = modal.querySelector("#tkErr");
    if(!title || !desc){ errEl.textContent = t('fillAllFields'); return; }
    const finish = (screenshot)=>{
      db.tickets[pageKey].push({
        id:uid("tk"), title, description:desc, errorLocation:loc, screenshot:screenshot||null,
        status:"open", openedBy:currentUser().username, date:nowStr(), reply:""
      });
      saveDB(); closeModal(); toast(t('toastTicketOpened'));
      renderTicketsSection(body, pageKey);
    };
    if(fileInput.files && fileInput.files[0]){
      const reader = new FileReader();
      reader.onload = ()=> finish(reader.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else finish(null);
  };
}
function openTicketDetail(pageKey, tkId, body){
  const tk = db.tickets[pageKey].find(x=>x.id===tkId);
  if(!tk) return;
  const canEditStatus = tk.status==="open";
  const html = `
    <div class="modal-head"><h3>${t('ticketDetails')}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="field"><label>${t('ticketTitleField')}</label><input id="dTitle" type="text" value="${escAttr(tk.title)}" ${canEditStatus?'':'disabled'}></div>
    <div class="field"><label>${t('description')}</label><textarea id="dDesc" rows="3" ${canEditStatus?'':'disabled'}>${escHtml(tk.description)}</textarea></div>
    <div class="field"><label>${t('errorLocation')}</label><input id="dLoc" type="text" value="${escAttr(tk.errorLocation||'')}" ${canEditStatus?'':'disabled'}></div>
    ${tk.screenshot ? `<img class="screenshot-preview" src="${tk.screenshot}">` : ""}
    <div class="field" style="margin-top:14px;"><label>${t('reply')}</label>
      <textarea id="dReply" rows="3" placeholder="${t('writeReply')}">${escHtml(tk.reply||"")}</textarea>
    </div>
    <div style="font-size:11.5px;color:var(--text-faint);margin-top:4px;">${t('openedBy')}: ${escHtml(tk.openedBy)} · ${escHtml(tk.date)} · <span class="${tk.status==='open'?'status-open':'status-closed'}">${tk.status==='open'?t('open'):t('closed')}</span></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>${t('cancel')}</button>
      <button class="btn btn-violet" id="dSaveReply">${t('saveReply')}</button>
      ${tk.status==="open" ? `<button class="btn btn-ghost" id="dEdit">${t('editTicket')}</button><button class="btn btn-danger" id="dClose">${t('closeTicket')}</button>` : ""}
    </div>`;
  const modal = openModal(html, true);
  modal.querySelector("#dSaveReply").onclick = ()=>{
    tk.reply = modal.querySelector("#dReply").value;
    saveDB(); toast(t('toastTicketUpdated')); closeModal(); renderTicketsSection(body, pageKey);
  };
  const editBtn = modal.querySelector("#dEdit");
  if(editBtn) editBtn.onclick = ()=>{
    tk.title = modal.querySelector("#dTitle").value.trim() || tk.title;
    tk.description = modal.querySelector("#dDesc").value.trim() || tk.description;
    tk.errorLocation = modal.querySelector("#dLoc").value.trim();
    saveDB(); toast(t('toastTicketUpdated')); closeModal(); renderTicketsSection(body, pageKey);
  };
  const closeBtn = modal.querySelector("#dClose");
  if(closeBtn) closeBtn.onclick = ()=>{
    tk.status = "closed";
    saveDB(); toast(t('toastTicketClosed')); closeModal(); renderTicketsSection(body, pageKey);
  };
}

/* ======================================================================
   REPORTS SECTION (shared: sap / inventory / projects)
   ====================================================================== */
function renderReportsSection(body, pageKey){
  const files = db.reports[pageKey] || [];
  body.innerHTML = `
    <div class="glass section-card slide-up">
      <div class="section-card-head">
        <h3>${t('reportsTitle')}</h3>
        <label class="btn btn-primary btn-sm" style="position:relative;overflow:hidden;">
          ${t('importFile')}
          <input type="file" id="importFileInput" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
        </label>
      </div>
      ${files.length===0 ? `<div class="empty-state"><div class="ic">🗂</div><p>${t('noFiles')}</p><p style="margin-top:4px;">${t('noFilesSub')}</p></div>` : `
      <div>
        ${files.slice().reverse().map(f=>`
          <div class="file-row">
            <div class="file-ic">📄</div>
            <div class="file-info">
              <div class="fn">${escHtml(f.name)}</div>
              <div class="fm">${t('uploadedBy')}: ${escHtml(f.uploadedBy)} · ${escHtml(f.date)} · ${formatSize(f.size)}</div>
            </div>
            <button class="btn btn-ghost btn-sm" data-export="${f.id}">${t('exportFile')}</button>
          </div>`).join("")}
      </div>`}
    </div>
  `;
  document.getElementById("importFileInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      db.reports[pageKey].push({
        id:uid("file"), name:file.name, size:file.size, type:file.type, data:reader.result,
        date:nowStr(), uploadedBy:currentUser().username
      });
      saveDB(); toast(t('toastFileImported')); renderReportsSection(body, pageKey);
    };
    reader.readAsDataURL(file);
  });
  body.querySelectorAll("[data-export]").forEach(b=>{
    b.onclick = ()=>{
      const f = db.reports[pageKey].find(x=>x.id===b.dataset.export);
      const a = document.createElement("a");
      a.href = f.data; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    };
  });
}
function formatSize(bytes){
  if(!bytes) return "0 KB";
  const kb = bytes/1024;
  if(kb<1024) return kb.toFixed(1)+" KB";
  return (kb/1024).toFixed(1)+" MB";
}

   INIT
   ====================================================================== */
(async function init(){
  applyTheme();
  applyLangToggle();
  if(getToken()){
    await bootApp();
  } else {
    renderLogin();
  }
})();
</script>
